name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Notify Discord (Build Started)
        if: github.event_name != 'pull_request'
        run: node .github/scripts/discord-notify.mjs started "Build & Test"
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun test

      - name: Build Next.js application
        run: node node_modules/.bin/next build
        env:
          NEXT_PUBLIC_APP_URL: "https://osusearch.netamaru.id"

      - name: Notify Discord (Build Failed)
        if: failure()
        run: node .github/scripts/discord-notify.mjs failure "Build & Test"
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

  deploy:
    name: Deploy to Server via SSH
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute deployment commands over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e

            # Navigate to application directory
            cd ${{ secrets.SSH_TARGET_DIR || '~/osu-search' }}

            # Ensure Bun is available in PATH
            export BUN_INSTALL="$HOME/.bun"
            export PATH="$BUN_INSTALL/bin:$PATH"

            echo "Pulling latest changes from main..."
            git pull origin main

            echo "Installing dependencies..."
            bun install --frozen-lockfile

            echo "Building application..."
            if command -v node &> /dev/null && [ -f "node_modules/.bin/next" ]; then
              node node_modules/.bin/next build
            else
              bun run build
            fi

            # Resolve custom port (default to 3000)
            APP_PORT="${{ secrets.PORT || secrets.APP_PORT || '3000' }}"
            export PORT="$APP_PORT"

            echo "Managing PM2 process 'osusearch.netamaru.id' on port $APP_PORT..."
            if pm2 describe "osusearch.netamaru.id" > /dev/null 2>&1; then
              echo "PM2 process 'osusearch.netamaru.id' found. Reloading..."
              PORT=$APP_PORT pm2 reload "osusearch.netamaru.id" --update-env || PORT=$APP_PORT pm2 restart "osusearch.netamaru.id" --update-env
            else
              echo "PM2 process 'osusearch.netamaru.id' not found. Creating and starting..."
              if [ -f "ecosystem.config.cjs" ]; then
                PORT=$APP_PORT pm2 start ecosystem.config.cjs
              else
                PORT=$APP_PORT pm2 start "bun run start -p $APP_PORT" --name "osusearch.netamaru.id"
              fi
            fi

            # Save process list for system reboot persistence
            pm2 save

            echo "Deployment finished successfully on port $APP_PORT!"

      - name: Notify Discord (Deploy Successful / Done)
        if: success()
        run: node .github/scripts/discord-notify.mjs success "Deploy"
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

      - name: Notify Discord (Deploy Failed)
        if: failure()
        run: node .github/scripts/discord-notify.mjs failure "SSH Deploy"
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
